name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: hermes-voice_linux_x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: hermes-voice_win_x64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: hermes-voice_mac_x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: hermes-voice_mac_arm64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.target }})

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            dpkg \
            fakeroot

      - name: Install frontend deps
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          configPath: src-tauri/tauri.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: 'Hermes Voice ${{ github.ref_name }}'
          releaseBody: |
            ## Hermes Voice ${{ github.ref_name }}

            ### Instaladores
            - **Linux**: `.deb` (Debian/Ubuntu) ou `.AppImage` (universal)
            - **Windows**: `.exe` (NSIS installer)
            - **macOS**: `.dmg` (Intel + Apple Silicon)

            ### Checksums
            Verifique a integridade dos arquivos com os SHA256 publicados abaixo.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Generate checksums
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          cd src-tauri/target/${{ matrix.target }}/release/bundle
          find . -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.exe" -o -name "*.dmg" -o -name "*.msi" \) -exec sha256sum {} \; > ../../../../checksums-${{ matrix.target }}.txt
          mv ../../../../checksums-${{ matrix.target }}.txt .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi

      - name: Upload checksums
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: checksums-${{ matrix.target }}
          path: checksums-${{ matrix.target }}.txt

  publish-checksums:
    name: Publish consolidated checksums
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all checksums
        uses: actions/download-artifact@v4
        with:
          pattern: checksums-*
          path: checksums
          merge-multiple: true

      - name: Consolidate checksums
        run: |
          cat checksums/*.txt > checksums.txt
          sort -k2 checksums.txt | uniq > checksums-sorted.txt
          mv checksums-sorted.txt checksums.txt

      - name: Upload consolidated checksums to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: checksums.txt
          tag: ${{ github.ref_name }}
          overwrite: true
          file_glob: false

  # Also attach binaries to the release
  attach-binaries:
    name: Attach binaries to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hermes-voice_*
          path: artifacts
          merge-multiple: true

      - name: Upload all binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: artifacts/**
          tag: ${{ github.ref_name }}
          overwrite: true
          file_glob: true
