<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' http://127.0.0.1:8420; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://127.0.0.1:8420 ws://127.0.0.1:8420; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">
  <title>Hermes Design Canvas</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, -apple-system, sans-serif; background: var(--hds-bg, #f5f5f0); color: var(--hds-fg, #1a1a1a); }
    body { display: flex; flex-direction: column; }
    [data-canvas-element] { position: relative; outline: none; }
    [data-canvas-element]:hover { outline: 2px solid var(--hds-accent, #ff8c00); outline-offset: 2px; }
    [data-canvas-element].selected { outline: 2px solid var(--hds-accent, #ff8c00); outline-offset: 2px; }
    .canvas-drop-zone { min-height: 100px; border: 2px dashed var(--hds-border, rgba(255,255,255,0.1)); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--hds-muted, #888); font-size: 14px; }
    .canvas-drop-zone.active { border-color: var(--hds-accent, #ff8c00); background: rgba(255,140,0,0.1); }
  </style>
</head>
<body>
  <div id="canvas-root" data-canvas-root>
    <div class="canvas-drop-zone" data-drop-zone>Solte componentes aqui ou clique + para adicionar</div>
  </div>

  <script src="design-canvas.js"></script>
  <script>
    // Initialize DesignCanvas when loaded
    if (window.DesignCanvas) {
      window.canvas = new DesignCanvas({ 
        container: document.body,
        bridgeUrl: 'http://127.0.0.1:8420'
      });
    }
  </script>
</body>
</html>
